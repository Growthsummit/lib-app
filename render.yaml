# Render web service for the API. The database is hosted by Turso.
# The React frontend is deployed separately on Vercel.
services:
  - type: web
    name: library-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Set the generated value in the Render dashboard to sign in as admin.
      - key: ADMIN_PASSWORD
        generateValue: true
      # Set this to the Vercel URL with no trailing slash.
      - key: CLIENT_ORIGIN
        sync: false
      - key: ALLOW_VERCEL_PREVIEWS
        value: 'true'
